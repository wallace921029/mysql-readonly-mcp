[project]
name = "mysql-readonly-mcp"
version = "0.2.0"
description = "A read-only, multi-tenant MCP server for querying MySQL databases over HTTP."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "mcp[cli]>=1.27.1",
    "pymysql>=1.2.0",
    "pyyaml>=6.0.2",
    "starlette>=0.40.0",
    "uvicorn[standard]>=0.30.0",
]
