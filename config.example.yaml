# Copy to config.yaml and edit.
# Passwords and bearer tokens are NOT stored here; only the names of the
# environment variables that carry their real values. Inject those at runtime
# via .env.secrets (Docker) or systemd EnvironmentFile=.

server:
  host: 0.0.0.0
  port: 8000
  # Optional. MCP server name shown to clients; defaults to "mysql-readonly".
  # Useful to distinguish multiple instances (e.g. prod vs staging).
  name: mysql-readonly
  # Optional. Default number of rows to return in a query if not specified. Defaults to 100. Set to 0 for no limit.
  default_row_limit: 100
  # Optional. Absolute maximum number of rows a single query can return. Defaults to 1000. Set to 0 for no limit.
  max_row_limit: 1000
  # Optional. uvicorn event loop: "asyncio" (default), "uvloop", or "auto".
  # Keep "asyncio" on hosts with an older Docker — uvloop's libuv uses syscalls
  # (io_uring/clone3) that stale Docker seccomp profiles block, segfaulting on
  # startup. Use "uvloop" only where the host Docker is recent (24+).
  loop: asyncio
  # Optional. Extra business context appended AFTER the built-in tool
  # instructions. Describe your data/policies here, not tool behavior
  # (read-only rules, row caps, etc. are baked into the code).
  # instructions: |
  #   These databases belong to the orders team. Treat PII columns as sensitive.

sources:
  mysql-1:
    host: 10.0.0.5
    port: 3306
    user: ro_user
    password_env: MYSQL1_PASSWORD
    databases:
      - orders
      - users

  mysql-2:
    host: 10.0.0.9
    port: 3306
    user: ro_user
    password_env: MYSQL2_PASSWORD
    databases:
      - analytics
      - logs
      - events

tokens:
  - label: alice
    token_env: TOKEN_ALICE
    allow:
      - mysql-1.orders
      - mysql-1.users

  - label: bob
    token_env: TOKEN_BOB
    allow:
      - mysql-2.*           # all databases under mysql-2

  - label: admin
    token_env: TOKEN_ADMIN
    allow:
      - "*"                 # full access

audit:
  log_path: /var/log/mysql-mcp/audit.log
