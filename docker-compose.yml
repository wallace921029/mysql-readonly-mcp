services:
  mcp:
    # No `build:` — image is built locally and shipped via `docker save` /
    # `docker load`. Always tagged `latest`; `docker load` overwrites it each
    # deploy and `up -d` recreates the container.
    image: mysql-readonly-mcp:latest
    container_name: mysql-readonly-mcp
    restart: unless-stopped
    env_file: .env.secrets
    environment:
      CONFIG_PATH: /app/config.yaml
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./logs:/var/log/mysql-mcp
    # Bound to 0.0.0.0 — the container is reachable on <host>:8000 directly.
    # Put nginx + TLS in front if you want HTTPS / a domain (see README).
    ports:
      - "8000:8000"
